# Checks every push and pull request to develop and main: the web app type-checks and builds, nothing that ships
# to browsers has a high/critical advisory, and no secret is committed.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Type-check, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: No high or critical advisories in what ships to browsers
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.24.3"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
